services:
  db:
    image: postgres:16-alpine
    container_name: syllabus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syllabus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syllabus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/SyllabusApp.Api/Dockerfile
    container_name: syllabus_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # wlacza Scalar UI pod /scalar
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=syllabus_db;Username=postgres;Password=postgres"
      Jwt__Key: "docker-dev-key-zmien-mnie-min-32-znaki-1234567890"
      DefaultAdmin__Email: "admin@syllabus.local"
      DefaultAdmin__Password: "Admin1234"
      Cors__Origins__0: "http://localhost:8080"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/SyllabusApp.Web/Dockerfile
      args:
        API_BASE_URL: http://localhost:8081/
    container_name: syllabus_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
